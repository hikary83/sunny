<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 멋진 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 캐릭터 선택 화면 (HTML UI) -->
        <div id="ui-layer">
            <h2>주인공을 선택하세요!</h2>
            <div class="character-list">
                <button class="char-btn" data-char="🐶">🐶 강아지</button>
                <button class="char-btn" data-char="🦖">🦖 공룡</button>
                <button class="char-btn" data-char="🐧">🐧 펭귄</button>
            </div>
        </div>

        <!-- 훈련 선택 화면 (HTML UI) -->
        <div id="mission-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.9); border-radius: 10px; flex-direction: column; justify-content: center; align-items: center; z-index: 10;">
            <h2 style="font-size: 30px; margin-bottom: 20px;">어떤 훈련을 할까요?</h2>
            <button class="char-btn" id="btn-mouse" style="margin-bottom: 15px;">🖱️ 마우스 클릭 훈련 (1단계)</button>
            <button class="char-btn" id="btn-keyboard">⌨️ 키보드 자리 훈련 (1단계)</button>
            <button class="char-btn" id="btn-gym-exit" style="margin-top: 30px; background-color: #ff9999; font-size: 20px; padding: 10px 20px;">🚪 체육관 나가기 (수영하러 가기)</button>
        </div>
        
        <!-- 게임 화면이 그려질 도화지(캔버스)입니다 -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    
    <!-- 게임의 로직을 담당하는 자바스크립트 파일 연결 -->
    <script src="game.js"></script>
</body>
</html>
