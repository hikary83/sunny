<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 모바일 웹앱 전체화면 설정 (홈 화면 추가 시 앱처럼 동작) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>우리의 멋진 게임</title>
    <script>
        // 모바일 환경 디버깅을 위한 전역 자바스크립트 에러 감지기
        window.onerror = function(message, source, lineno, colno, error) {
            alert("자바스크립트 오류 감지!\n\n메시지: " + message + "\n위치: " + source + " (라인: " + lineno + ")");
            return false;
        };
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 캐릭터 선택 화면 (HTML UI) -->
        <div id="ui-layer">
            <h2>주인공을 선택하세요!</h2>
            <div class="character-list">
                <button class="char-btn" data-char="🐶"><img class="char-select-img" src="assets/player_dog_down.png" alt="강아지"></button>
                <button class="char-btn" data-char="🦖"><img class="char-select-img" src="assets/player_dino_down.png" alt="공룡"></button>
                <button class="char-btn" data-char="🐧"><img class="char-select-img" src="assets/player_penguin_down.png" alt="펭귄"></button>
                <button class="char-btn" data-char="👽"><img class="char-select-img" src="assets/player_stitch_down.png" alt="스티치"></button>
            </div>
        </div>

        <!-- 훈련 선택 화면 (HTML UI) -->
        <div id="mission-ui" class="overlay-ui" style="display: none;">
            <h2>🏋️‍♂️ 체육관 훈련소</h2>
            <p class="ui-desc">연습을 해서 코인도 벌고 체력도 회복해 보아요!</p>
            <button class="menu-btn" id="btn-mouse">🖱️ 마우스 클릭 훈련 (1단계)</button>
            <button class="menu-btn" id="btn-keyboard">⌨️ 키보드 자리 훈련 (1단계)</button>
            <button class="menu-btn back-btn" id="btn-gym-exit">🚪 체육관 나가기 (로비로 가기)</button>
        </div>

        <!-- 허브 / 로비 화면 (HTML UI) -->
        <div id="hub-ui" class="overlay-ui" style="display: none;">
            <h2>🏡 수영 마스터 로비</h2>
            <p class="ui-desc">무엇을 하고 싶으신가요?</p>
            <button class="menu-btn play-btn" id="btn-go-swim">🏊‍♂️ 수영 도전하러 가기</button>
            <button class="menu-btn" id="btn-go-gym">🏋️‍♂️ 체육관에서 훈련하기 (체력 충전)</button>
            <button class="menu-btn" id="btn-go-shop">🛒 상점 방문하기</button>
            <button class="menu-btn back-btn" id="btn-change-char" style="margin-top: 10px;">👤 다른 캐릭터 선택하기</button>
        </div>

        <!-- 난이도 선택 화면 (HTML UI) -->
        <div id="difficulty-ui" class="overlay-ui" style="display: none;">
            <h2>🌊 수영 난이도 선택</h2>
            <p class="ui-desc">도전할 수영장의 난이도를 골라주세요!</p>
            <button class="menu-btn diff-btn easy" data-diff="easy">🟢 초급 수영장</button>
            <button class="menu-btn diff-btn normal" data-diff="normal">🟡 중급 수영장</button>
            <button class="menu-btn diff-btn hard" data-diff="hard">🔴 고급 수영장</button>
            <button class="menu-btn back-btn" id="btn-diff-back">🚪 로비로 돌아가기</button>
        </div>

        <!-- 상점 화면 (HTML UI) -->
        <div id="shop-ui" class="overlay-ui" style="display: none;">
            <h2>🛒 요술 상점</h2>
            <p class="ui-desc">코인으로 유용한 아이템을 살 수 있어요!</p>
            <div class="shop-info">현재 보유 코인: <span id="shop-coins">0</span>💰</div>
            <div class="shop-items">
                <div class="shop-item">
                    <img class="shop-item-img" src="assets/item_drink.png" alt="체력 드링크">
                    <div class="shop-item-info">
                        <span class="item-name">체력 드링크</span>
                        <span class="item-effect">체력 +50 회복</span>
                    </div>
                    <button class="buy-btn" id="buy-drink">💰 10 코인</button>
                </div>
                <div class="shop-item">
                    <img class="shop-item-img" src="assets/item_fins.png" alt="오리발">
                    <div class="shop-item-info">
                        <span class="item-name">오리발</span>
                        <span class="item-effect">수영 이동 속도 상승</span>
                    </div>
                    <button class="buy-btn" id="buy-fins">💰 30 코인</button>
                </div>
                <div class="shop-item">
                    <img class="shop-item-img" src="assets/item_goggles.png" alt="물안경">
                    <div class="shop-item-info">
                        <span class="item-name">물안경</span>
                        <span class="item-effect">장애물 피해 50% 감소</span>
                    </div>
                    <button class="buy-btn" id="buy-goggles">💰 25 코인</button>
                </div>
            </div>
            <button class="menu-btn back-btn" id="btn-shop-back" style="margin-top: 15px;">🚪 로비로 돌아가기</button>
        </div>
        
        <!-- 게임 화면이 그려질 도화지(캔버스)입니다 -->
        <canvas id="gameCanvas" width="450" height="800"></canvas>

        <!-- 가상 키보드 패드 (모바일 키보드 훈련용) -->
        <div id="keyboard-pad" style="display: none;">
            <div class="key-row">
                <button class="key-btn">Q</button>
                <button class="key-btn">W</button>
                <button class="key-btn">E</button>
                <button class="key-btn">R</button>
                <button class="key-btn">T</button>
                <button class="key-btn">Y</button>
                <button class="key-btn">U</button>
                <button class="key-btn">I</button>
                <button class="key-btn">O</button>
                <button class="key-btn">P</button>
            </div>
            <div class="key-row">
                <button class="key-btn">A</button>
                <button class="key-btn">S</button>
                <button class="key-btn">D</button>
                <button class="key-btn">F</button>
                <button class="key-btn">G</button>
                <button class="key-btn">H</button>
                <button class="key-btn">J</button>
                <button class="key-btn">K</button>
                <button class="key-btn">L</button>
            </div>
            <div class="key-row">
                <button class="key-btn" style="flex-grow: 1.5; background-color: #f44336; box-shadow: 0 3px 0 #b71c1c;" id="btn-key-esc">ESC</button>
                <button class="key-btn">Z</button>
                <button class="key-btn">X</button>
                <button class="key-btn">C</button>
                <button class="key-btn">V</button>
                <button class="key-btn">B</button>
                <button class="key-btn">N</button>
                <button class="key-btn">M</button>
            </div>
        </div>
    </div>
    
    <!-- 게임의 로직을 담당하는 자바스크립트 파일 연결 -->
    <script src="game.js"></script>
</body>
</html>
